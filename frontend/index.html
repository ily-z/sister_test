<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />

    <title>Precision Fleet - Enterprise ERP</title>

    <!--
        Ikon dan font di-bundle sendiri (material-symbols + @fontsource/inter),
        bukan diambil dari CDN.

        Ini disengaja. Aplikasi ini dipakai dari jaringan internal yang
        sering tidak punya akses internet. Kalau font dan ikon berasal dari
        fonts.googleapis.com, seluruh ikon di aplikasi akan hilang begitu
        konektivitas ke internet terputus -- dan karena hampir tidak ada
        teks replacement, tampilan jadi rusak total tanpa error yang jelas.

        Konsekuensinya: halaman pertama tidak boleh bergantung pada CDN
        apa pun. Semua aset sudah ada di dalam dist/.
    -->
</head>
<body>
    <!--
        Pesan ini muncul hanya bila JavaScript gagal dimuat. Vue mengganti
        seluruh isi <div id="app"> setelah mount, jadi teks di sini adalah
        pesan cadangan yang menjelaskan penyebabnya.
    -->
    <div id="app">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
            <div style="text-align:center;max-width:420px;padding:24px">
                <h1 style="font-size:18px;font-weight:700;color:#0f172a;margin:0 0 8px">
                    Aplikasi tidak dapat dimuat
                </h1>
                <p style="font-size:14px;color:#64748b;margin:0 0 16px;line-height:1.6">
                    JavaScript tidak aktif atau gagal dimuat. Aktifkan JavaScript,
                    lalu muat ulang halaman.
                </p>
                <p style="font-size:12px;color:#94a3b8;margin:0">
                    Precision Fleet
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
